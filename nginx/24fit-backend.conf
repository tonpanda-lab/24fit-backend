server {
  listen 80;
  listen [::]:80;
  server_name api.nutrisimple.site;

  # No index, no root, no static files — proxy EVERYTHING
  location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;  # Tell Node.js the original request was HTTPS

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
  }

  # Health check (optional, bypasses logs)
  location /health {
      access_log off;
      proxy_pass http://127.0.0.1:3000/v1/health;
  }
}
